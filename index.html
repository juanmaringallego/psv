<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jemg.tech</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="scan-line"></div>

  <main class="terminal">
    <div class="terminal-header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="terminal-title">jemg@server:~</span>
    </div>

    <div class="terminal-body">
      <div id="output" class="output"></div>
      <div class="input-line">
        <span class="prompt">visitor@jemg.tech:~$</span>
        <span id="cursor" class="cursor">_</span>
      </div>
    </div>
  </main>

  <div class="hint">
    Escribe <span class="cmd">help</span> mentalmente... o solo disfruta la vista
  </div>

  <script src="script.js"></script>
</body>
</html>
