<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Paulina</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div id="stars-container"></div>

  <!-- SALUDO INICIAL -->
  <section id="greeting" class="screen active">
    <div class="content-box">
      <div class="hello-icon" id="hello-icon">&#10024;</div>
      <p id="typewriter" class="typewriter-text"></p>
      <button id="btn-ver" class="btn-main hidden" onclick="showSurprise()">Ver que es</button>
    </div>
  </section>

  <!-- SORPRESA DEL DIA -->
  <section id="surprise" class="screen">
    <div class="content-box">
      <div class="surprise-icon" id="surprise-icon"></div>
      <div id="surprise-card" class="surprise-card">
        <p id="surprise-text" class="surprise-text"></p>
      </div>
      <div id="game-area" class="game-area"></div>
      <p class="footer-note">Vuelve manana, habra algo nuevo esperandote</p>
      <button class="btn-secondary" onclick="showGreeting()">&#8592; Volver</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
